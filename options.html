<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Настройки Minimal Lens</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
      width: 320px;
      background: #fafafa;
    }
    label {
      font-size: 12px;
      font-weight: bold;
      color: #333;
    }
    input {
      width: 100%;
      padding: 6px;
      margin-top: 6px;
      margin-bottom: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 6px 14px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #status {
      margin-top: 8px;
      font-size: 11px;
      color: green;
    }
  </style>
</head>
<body>
  <label for="apiKey">Google Gemini API Key:</label>
  <input type="password" id="apiKey" placeholder="AIzaSy...">
  <button id="saveBtn">Сохранить</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
